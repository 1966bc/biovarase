; ----------------------------------------------------------------------
; workstation_profiles.ini
; Import profiles for QC files in Biovarase
;
; Filenames MUST contain only the device_id, e.g.:
;   123e4567-e89b-12d3-a456-426614174001
;
; Section name format:
;   device_<device_id>
;
; This profile is for:
;   device_id = 123e4567-e89b-12d3-a456-426614174001   (QTRAP 6500)
;
; Header format (tab-delimited):
;   Row | Component Name | Barcode | Num. Values | Mean
;       | Standard Deviation | Percent CV | Value #1 ...
;
; Mapping:
;   Component Name  -> tests.description
;   Barcode         -> batches.lot_number
;   Mean            -> results.result
; ----------------------------------------------------------------------

[device_123e4567-e89b-12d3-a456-426614174001]
description        = Sciex QTRAP 6500+
device_id          = 123e4567-e89b-12d3-a456-426614174001
extensions         = .txt
delimiter          = tab

; Column mapping (exact header strings)
component_field    = Component Name
id_field           = Barcode
result_field       = Mean

; Optional fields (not used now, reserved for future)
sample_type_field  =
sample_type_value  =

; Filters on analyte name
exclude_suffix     = _qual
exclude_prefix     =

; Result formatting: floatN -> format with N decimals
result_format      = float3


; ----------------------------------------------------------------------
; Optional default profile (fallback)
; ----------------------------------------------------------------------
[default]
description        = Generic QC tab-delimited file
extensions         = .txt,.csv
delimiter          = tab
component_field    = Component Name
id_field           = Barcode
result_field       = Mean
sample_type_field  =
sample_type_value  =
exclude_suffix     =
exclude_prefix     =
result_format      = raw

[device_987e6543-e89b-12d3-a456-4266141740AA]
description        = LC-MS/MS Sciex QTRAP 5500
device_id          = 987e6543-e89b-12d3-a456-4266141740AA
extensions         = .txt
delimiter          = tab

; Column mapping (exact header strings)
component_field    = Component Name
id_field           = Sample Name
result_field       = Calculated Concentration

; Filter: keep only QC samples
sample_type_field  = Sample Type
sample_type_value  = Quality Control

; Filters on analyte name
exclude_suffix     =
exclude_prefix     =

; Result formatting: floatN -> format with N decimals
result_format      = float3

