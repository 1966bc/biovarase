[pytest]
# Pytest configuration for Biovarase test suite
# Python 3.7+ compatible

# Test discovery
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Output options
# -v: Verbose output
# --strict-markers: Raise error on unknown markers
# --tb=short: Short traceback format
# --disable-warnings: Disable pytest warnings
# -ra: Show summary of all test outcomes
# --color=yes: Colored output
addopts =
    -v
    --strict-markers
    --tb=short
    --disable-warnings
    -ra
    --color=yes

# Markers for test categorization
markers =
    unit: Unit tests (fast, no external dependencies)
    integration: Integration tests (database, file I/O)
    slow: Slow tests (> 1 second)
    critical: Critical tests for medical safety
    westgard: Westgard QC rule tests
    qc: Quality control statistical tests
    security: Security and encryption tests

# Coverage options (if pytest-cov installed)
# addopts = --cov=. --cov-report=html --cov-report=term

# Minimum Python version
minversion = 6.0

# Test timeout (if pytest-timeout installed)
# timeout = 300  # 5 minutes max per test
