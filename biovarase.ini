; Biovarase configuration.
; Lines starting with ; or # are comments.
; The program writes some of these back, from its own windows: only the line
; that changes is rewritten, so these comments stay where they are.

[window]
; The ttk theme: clam is the one whose colours tools.py can set.
theme = clam

[statistics]
; Degrees of freedom of the standard deviation: 0 for the population, 1 for a
; sample. ISO/TS 20914 computes the standard deviation of the control results
; as a sample, so this is usually 1; it is 0 here because that is how this
; laboratory has always computed it.
ddof = 0
; Coverage factor for the expanded uncertainty: 1.65 is one-sided 95%, 1.96 is
; two-sided 95%, 2 is the conventional k = 2.
zscore = 1.65
; How many results a series needs before the Westgard rules are evaluated.
; Below this the chart says NED, not evaluated.
observations = 30
; Above this correlation a Youden plot says the two controls agree.
correlation_coefficient = 0.975

[display]
; dd-mm-yyyy, mm-dd-yyyy or yyyy-mm-dd.
date_format = dd-mm-yyyy
; How many results the main window loads at once, newest first.
records = 200
; How many points the chart draws.
elements = 30
; Show lots past their expiration date in the lists.
show_expired_batches = 0
; Show only the lots with a result in the last months.
show_recent_only = 1
; Open the main window on the lot that was open when it was last closed.
remember_batch = 1
